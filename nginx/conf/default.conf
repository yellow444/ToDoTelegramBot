server {
    listen 443 default_server ssl;
    http2  on;

    server_name todo.example.com www.todo.example.com localhost;

    ssl_certificate /etc/nginx/ssl/live/todo.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/todo.example.com/privkey.pem;
    
    location / {
        root /etc/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
